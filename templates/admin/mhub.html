{% extends "base.html" %}{% block title %}M-Hub Feature — Admin{% endblock %}{% block content %}<section class="admin-wrap"><div class="admin-head"><span class="eyebrow">ADMIN CONTROL</span><h1>M-Hub 2026 feature banner</h1><p>Manage the promotional feature shown across CIRCULINK. The supplied M-Hub logo is bundled locally.</p></div>{% include "admin/_nav.html" %}<form class="form" method="post"><div class="mhub-preview"><img src="{{url_for('static',filename='img/mhub-2026.png')}}" alt="M-Hub 2026"></div><label><span>Show feature</span><input type="checkbox" name="enabled" {% if ad.enabled %}checked{% endif %}></label><label>Kicker<input name="kicker" value="{{ad.kicker}}"></label><label>Title<input name="title" value="{{ad.title}}"></label><label>Message<textarea name="text">{{ad.text}}</textarea></label><label>Internal link<input name="link_url" value="{{ad.link_url}}"></label><label>Button label<input name="link_label" value="{{ad.link_label}}"></label><button class="button primary">Save M-Hub feature</button></form></section>{% endblock %}
